name: Atualizar notícias

# A cada 2 horas lê os feeds do ge e do Meu Timão e grava `noticias` em public/estado.json.
# Só faz commit se algo mudou. Push feito com o GITHUB_TOKEN não dispara outros workflows,
# então o deploy é chamado de propósito no final.
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: noticias
  cancel-in-progress: false

jobs:
  noticias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/atualizar-noticias.mjs
      - run: node scripts/validar-estado.mjs
      - name: Commit e deploy, só se mudou
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/sync-embutido.mjs
          if git diff --quiet -- public/estado.json src/lib/estado-embutido.json; then
            echo "Sem notícias novas."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/estado.json src/lib/estado-embutido.json
          git commit -m "Noticias: atualizacao automatica"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run pages.yml --ref main
